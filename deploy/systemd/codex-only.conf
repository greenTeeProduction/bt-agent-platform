# Apply to each BT user unit. A final EnvironmentFile must carry these same
# values if an earlier EnvironmentFile overrides Environment= declarations.
[Service]
Environment=BT_LLM_SOL_ONLY=true
Environment=BT_LLM_PROVIDER=codex
Environment=BT_CODEX_BIN=%h/.local/bin/codex
Environment=BT_SUPERPOWERS_CODEX_BIN=%h/.local/bin/codex
Environment=BT_FALLBACK_MODELS=
Environment=BT_SUPERPOWERS_PROVIDER=codex
Environment=BT_SUPERPOWERS_CODEX_ONLY=true
Environment=BT_SUPERPOWERS_RATE_LIMIT_FAILOVER=false
Environment=BT_SUPERPOWERS_CODEX_MODEL=gpt-6.1-sol
EnvironmentFile=-%h/.config/bt/codex-only.env
