# Install as rate-limit-failover.conf in each user service's .service.d
# directory only after this branch has been safely integrated and built.
# Applies to bt-agent, bt-dashboard, and bt-gardener.
[Service]
Environment=BT_SUPERPOWERS_RATE_LIMIT_FAILOVER=true
Environment=BT_SUPERPOWERS_CODEX_MODEL=gpt-5.3-codex-spark
