version: "2"
run:
  go: 1.26.5
  tests: true
linters:
  disable:
    - unused
  enable:
    - bodyclose
    - copyloopvar
    - errcheck
    - gocritic
    - govet
    - ineffassign
    - intrange
    - misspell
    - modernize
    - nilerr
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - usestdlibvars
    - usetesting
  settings:
    gocritic:
      disable-all: true
      enabled-checks:
        - appendCombine
        - badLock
        - boolExprSimplify
        - equalFold
        - indexAlloc
        - rangeExprCopy
        - regexpSimplify
        - sloppyReassign
        - truncateCmp
        - unnecessaryDefer
        - weakCond
    usetesting:
      # os.Setenv/Chdir/MkdirTemp -> the testing helpers, which clean up on their
      # own. context-background/context-todo stay off: t.Context() is cancelled
      # before Cleanup runs, and the tests that build their own context here do
      # it to exercise cancellation.
      context-background: false
      context-todo: false
      os-chdir: true
      os-setenv: true
      os-temp-dir: true
      os-create-temp: true
    revive:
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: package-comments
        - name: range
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
        - name: empty-block
        - name: superfluous-else
        - name: unused-parameter
          disabled: true
        - name: unreachable-code
        - name: redefines-builtin-id
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - vendor
      - .git
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - vendor
      - .git
      - third_party$
      - builtin$
      - examples$
